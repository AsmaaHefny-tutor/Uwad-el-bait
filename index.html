<!DOCTYPE html>
<html lang="en">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        pastel: {
                            blue: '#e0f2fe',
                            purple: '#f3e8ff',
                            pink: '#fce7f3',
                            yellow: '#fef9c3',
                            orange: '#ffedd5',
                            mint: '#d1fae5'

                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif']

    <style>
        /* Custom Styles & Interactive Elements */
        body {
            background-color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        .drop-zone-active {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            transform: scale(1.02);
        }

        .draggable-item {
            cursor: grab;
            touch-action: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .draggable-item:active {
            cursor: grabbing;
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .draggable-item.selected-tap {
            ring: 4px;
            ring-color: #3b82f6;
            border-color: #2563eb;
            background-color: #dbeafe;
        }

        .room-svg {
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.05));
        }

        /* Smooth bounce animation for correct answer */
        @keyframes bounce-sm {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-sm {
            animation: bounce-sm 0.4s ease infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 text-slate-800">

    <!-- Top Nav / Header -->
    <header class="w-full max-w-3xl bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-house-chimney"></i>
            </div>
            <div>
                <h1 class="font-display font-bold text-lg md:text-xl text-slate-800">Egyptian Arabic 101</h1>
                <p class="text-xs text-slate-500 font-medium">Topic: Rooms of the House (Franco)</p>
            </div>
        </div>
        <div id="score-badge" class="hidden md:flex items-center space-x-1.5 bg-amber-50 border border-amber-200 text-amber-700 px-3 py-1.5 rounded-full text-sm font-semibold">
            <i class="fa-solid fa-star text-amber-500"></i>
            <span id="header-score">Score: 0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-3xl bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden flex flex-col flex-1 min-h-[580px] relative">
        
        <!-- Progress Bar (Visible during questions) -->
        <div id="progress-container" class="w-full bg-slate-100 h-3 border-b border-slate-100 flex">
            <div id="progress-bar" class="bg-emerald-500 h-full transition-all duration-500 ease-out w-0"></div>
        </div>

        <div id="step-indicator" class="px-6 pt-4 pb-1 text-xs font-bold tracking-wider text-slate-400 uppercase flex justify-between items-center">
            <span id="activity-title">Activity 1: Look & Choose</span>
            <span id="question-number">Question 1 of 12</span>
        </div>

        <!-- Dynamic Content Card Container -->
        <div id="app-card" class="p-4 md:p-8 flex-1 flex flex-col justify-between">
            <!-- Dynamic Content inserted via JS -->
        </div>

        <!-- Global Feedback Modal / Toast -->
        <div id="feedback-banner" class="hidden absolute bottom-4 left-4 right-4 p-4 rounded-2xl border text-center font-bold shadow-lg transition-all transform translate-y-2 opacity-0 z-50 flex items-center justify-center space-x-3">
            <span id="feedback-icon" class="text-2xl"></span>
            <span id="feedback-text" class="text-base md:text-lg"></span>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-6 text-center text-xs text-slate-400 font-medium">
        Learn Egyptian Arabic for Beginners &bull; Franco Edition
    </footer>

        // Master Question Dataset (12 Questions covering all 6 activities)
        const QUESTIONS = [
            // Activity 1: Look & Choose
            {
                activity: "Activity 1: Look & Choose",
                type: "mcq_image",
                instruction: "Look at the picture and answer the question:",
                question: "Where do you sleep?",
                room: "bedroom",
                options: [
                    { text: "oda el nom", correct: true },
                    { text: "7ammam", correct: false },
                    { text: "matb5", correct: false }
                ]
            },
            {
                activity: "Activity 1: Look & Choose",
                type: "mcq_image",
                instruction: "Look at the picture and answer the question:",
                question: "Where do you cook food?",
                room: "kitchen",
                options: [
                    { text: "salon", correct: false },
                    { text: "matb5", correct: true },
                    { text: "sofra", correct: false }
                ]
            },

            // Activity 2: Match the Picture
            {
                activity: "Activity 2: Match the Picture",
                type: "matching_all",
                instruction: "Drag each Franco word (or tap word then tap box) to its matching room:",
                items: [
                    { id: "b1", room: "bedroom", label: "oda el nom" },
                    { id: "b2", room: "bathroom", label: "7ammam" },
                    { id: "b3", room: "kitchen", label: "matb5" },
                    { id: "b4", room: "salon", label: "salon" },
                    { id: "b5", room: "sofra", label: "sofra" }
                ]
            },

            // Activity 3: English -> Franco
            {
                activity: "Activity 3: English → Franco",
                type: "mcq_text",
                instruction: "Choose the correct Egyptian Arabic (Franco) word for:",
                question: "Bathroom",
                options: [
                    { text: "salon", correct: false },
                    { text: "7ammam", correct: true },
                    { text: "sofra", correct: false }
                ]
            },
            {
                activity: "Activity 3: English → Franco",
                type: "mcq_text",
                instruction: "Choose the correct Egyptian Arabic (Franco) word for:",
                question: "Dining room",
                options: [
                    { text: "sofra", correct: true },
                    { text: "oda el nom", correct: false },
                    { text: "matb5", correct: false }
                ]
            },

            // Activity 4: What Room is It?
            {
                activity: "Activity 4: What Room is It?",
                type: "mcq_image",
                instruction: "Look at the room illustration below:",
                question: "What room is this?",
                room: "salon",
                options: [
                    { text: "7ammam", correct: false },
                    { text: "salon", correct: true },
                    { text: "sofra", correct: false }
                ]
            },
            {
                activity: "Activity 4: What Room is It?",
                type: "mcq_image",
                instruction: "Look at the room illustration below:",
                question: "What room is this?",
                room: "bathroom",
                options: [
                    { text: "7ammam", correct: true },
                    { text: "oda el nom", correct: false },
                    { text: "matb5", correct: false }

                type: "drag_single",
                instruction: "Drag the correct Franco label onto the picture box:",

                targetRoom: "bedroom",

                type: "drag_single",
                instruction: "Drag the correct Franco label onto the picture box:",

        // App State
        let currentStep = 0;
        let score = 0;
        let selectedTapToken = null; // For tap-to-select accessibility on drag activities
        let matchingState = {}; // State for Activity 2

        // DOM Element Cache
        const appCard = document.getElementById('app-card');
        const progressBar = document.getElementById('progress-bar');
        const questionNumberEl = document.getElementById('question-number');
        const activityTitleEl = document.getElementById('activity-title');
        const headerScoreEl = document.getElementById('header-score');
        const scoreBadge = document.getElementById('score-badge');
        const feedbackBanner = document.getElementById('feedback-banner');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');

        // Web Audio Context Synthesizer for Fun Sound Effects (No external audio files needed)
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'incorrect') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
                    osc.frequency.exponentialRampToValueAtTime(164.81, ctx.currentTime + 0.2); // E3
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {
                // Audio Context fallback if blocked
            }
        };

        function initApp() {
            currentStep = 0;
            score = 0;
            scoreBadge.classList.remove('hidden');
            renderStep();
        }

        function updateProgress() {
            const total = QUESTIONS.length;
            const progressPct = ((currentStep) / total) * 100;
            progressBar.style.width = `${progressPct}%`;
            questionNumberEl.textContent = `Question ${currentStep + 1} of ${total}`;
            headerScoreEl.textContent = `Score: ${score}`;
        }

        function renderStep() {
            if (currentStep >= QUESTIONS.length) {
                renderFinalQuizResults();
                return;
            }

            updateProgress();
            const q = QUESTIONS[currentStep];
            activityTitleEl.textContent = q.activity;

            if (q.type === 'mcq_image') {
                renderMCQImage(q);
            } else if (q.type === 'mcq_text') {
                renderMCQText(q);
            } else if (q.type === 'matching_all') {
                renderMatchingAll(q);
            } else if (q.type === 'drag_single') {
                renderDragSingle(q);
            }
        }

        // 1. MCQ with Image Render (Activities 1, 4, 5)
        function renderMCQImage(q) {
            appCard.innerHTML = `
                <div class="flex flex-col items-center text-center space-y-4">
                    <p class="text-sm md:text-base text-slate-500 font-medium">${q.instruction}</p>
                    <h2 class="text-xl md:text-2xl font-bold font-display text-slate-800">${q.question}</h2>
                    
                    <div class="w-full max-w-sm h-48 md:h-56 bg-slate-50 border border-slate-200 rounded-2xl p-2 flex items-center justify-center shadow-inner">
                        ${ROOM_SVGS[q.room]}
                    </div>

                    <div class="w-full max-w-md grid grid-cols-1 md:grid-cols-3 gap-3 pt-4">
                        ${q.options.map((opt, idx) => `
                            <button onclick="handleMCQAnswer(${opt.correct}, this)" 
                                class="w-full py-3.5 px-4 bg-white hover:bg-slate-50 border-2 border-slate-200 hover:border-emerald-500 rounded-xl font-display font-bold text-lg md:text-xl text-slate-700 shadow-sm transition-all transform active:scale-95 flex items-center justify-center">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 2. MCQ Text Only Render (Activity 3)
        function renderMCQText(q) {
            appCard.innerHTML = `
                <div class="flex flex-col items-center text-center space-y-6 my-auto">
                    <p class="text-sm md:text-base text-slate-500 font-medium">${q.instruction}</p>
                    
                    <div class="bg-sky-50 border border-sky-200 px-8 py-6 rounded-2xl shadow-sm">
                        <span class="text-xs font-bold text-sky-600 uppercase tracking-wider block mb-1">English Term</span>
                        <h2 class="text-3xl md:text-4xl font-extrabold font-display text-slate-800">${q.question}</h2>
                    </div>

                    <div class="w-full max-w-md space-y-3 pt-2">
                        ${q.options.map((opt) => `
                            <button onclick="handleMCQAnswer(${opt.correct}, this)" 
                                class="w-full py-4 px-6 bg-white hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-500 rounded-2xl font-display font-bold text-xl text-slate-700 shadow-sm transition-all transform active:scale-98 text-left flex justify-between items-center group">
                                <span>${opt.text}</span>
                                <i class="fa-solid fa-arrow-right text-slate-300 group-hover:text-emerald-500 transition-colors"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 3. Activity 2: Match All Pictures
        function renderMatchingAll(q) {
            matchingState = {}; // Reset
            selectedTapToken = null;

            appCard.innerHTML = `
                <div class="flex flex-col space-y-4">
                    <p class="text-sm text-slate-500 font-medium text-center">${q.instruction}</p>
                    
                    <!-- Draggable Word Bank -->
                    <div id="word-bank" class="flex flex-wrap gap-2 justify-center p-3 bg-slate-100 rounded-2xl border border-slate-200 min-h-[60px]">
                        ${q.items.map(item => `
                            <div id="drag-${item.id}" 
                                 draggable="true" 
                                 ondragstart="handleMatchDragStart(event, '${item.id}', '${item.room}')"
                                 onclick="handleTokenTap('${item.id}', '${item.room}', this)"
                                 class="draggable-item px-4 py-2 bg-white border-2 border-slate-300 hover:border-blue-400 rounded-xl shadow-sm font-display font-bold text-base md:text-lg text-slate-700 cursor-pointer">
                                ${item.label}
                            </div>
                        `).join('')}
                    </div>

                    <!-- Room Drop Cards Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 pt-2">
                        ${q.items.map(item => `
                            <div id="drop-${item.room}" 
                                 ondragover="allowDrop(event)" 
                                 ondragleave="handleMatchDragLeave(event)"
                                 ondrop="handleMatchDrop(event, '${item.room}')"
                                 onclick="handleBoxTap('${item.room}')"
                                 class="drop-zone border-2 border-dashed border-slate-300 rounded-2xl p-2 flex flex-col items-center justify-between min-h-[160px] bg-slate-50 transition-all">
                                <div class="w-full h-24 p-1">
                                    ${ROOM_SVGS[item.room]}
                                </div>
                                <div id="target-slot-${item.room}" class="w-full py-1.5 px-1 bg-white border border-slate-200 rounded-lg text-center font-display font-bold text-xs text-slate-400">
                                    Drop / Tap Here
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <button id="check-matching-btn" onclick="checkMatchingResults()" class="mt-4 w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-display font-bold rounded-xl shadow-md transition-all text-lg">
                        Check All Matches ⭐
                    </button>
                </div>
            `;
        }

        // 4. Activity 6: Drag Single Word to Picture
        function renderDragSingle(q) {
            selectedTapToken = null;

            appCard.innerHTML = `
                <div class="flex flex-col items-center text-center space-y-4">
                    <p class="text-sm text-slate-500 font-medium">${q.instruction}</p>
                    <div class="inline-block bg-amber-100 text-amber-800 px-4 py-1.5 rounded-full font-bold text-sm">
                        Target English: ${q.targetEnglish}
                    </div>

                    <!-- Target Image Zone -->
                    <div id="single-drop-zone" 
                         ondragover="allowDrop(event)"
                         ondragleave="handleSingleDragLeave(event)"
                         ondrop="handleSingleDrop(event, '${q.correct}')"
                         onclick="handleSingleBoxTap('${q.correct}')"
                         class="w-full max-w-sm border-3 border-dashed border-slate-300 bg-slate-50 rounded-2xl p-4 flex flex-col items-center justify-center space-y-3 transition-all min-h-[220px]">
                        <div class="w-full h-40">
                            ${ROOM_SVGS[q.targetRoom]}
                        </div>
                        <div id="single-slot-text" class="px-6 py-2 bg-white border border-slate-200 rounded-xl font-display font-bold text-sm text-slate-400">
                            Drop correct Franco word here
                        </div>
                    </div>

                    <!-- Options draggable chips -->
                    <div class="flex flex-wrap gap-3 justify-center pt-2">
                        ${q.options.map((opt, i) => `
                            <div id="single-opt-${i}" 
                                 draggable="true" 
                                 ondragstart="handleSingleDragStart(event, '${opt}')"
                                 onclick="handleSingleTokenTap('${opt}', this)"
                                 class="draggable-item px-5 py-3 bg-white border-2 border-slate-300 hover:border-emerald-400 rounded-xl font-display font-bold text-lg text-slate-700 shadow-md">
                                ${opt}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // MCQ Answer Handling
        function handleMCQAnswer(isCorrect, btnElement) {
            // Disable all option buttons
            const buttons = appCard.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                btnElement.classList.remove('bg-white', 'border-slate-200');
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'animate-bounce-sm');
                playSound('correct');
                score += 10;
                showFeedback(true, "Great job! 🎉");
            } else {
                btnElement.classList.remove('bg-white', 'border-slate-200');
                btnElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                playSound('incorrect');
                showFeedback(false, "Almost! Try again.");
            }

            setTimeout(() => {
                hideFeedback();
                currentStep++;
                renderStep();
            }, 1400);
        }

        // Matching Drag/Tap Handlers
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drop-zone-active');
        }

        function handleMatchDragStart(ev, id, room) {
            ev.dataTransfer.setData("text/plain", JSON.stringify({ id, room }));
        }

        function handleMatchDragLeave(ev) {
            ev.currentTarget.classList.remove('drop-zone-active');
        }

        function handleMatchDrop(ev, targetRoom) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drop-zone-active');
            const data = JSON.parse(ev.dataTransfer.getData("text/plain"));
            assignMatch(data.id, data.room, targetRoom);
        }

        function handleTokenTap(id, room, el) {
            document.querySelectorAll('.draggable-item').forEach(d => d.classList.remove('selected-tap'));
            if (selectedTapToken?.id === id) {
                selectedTapToken = null;
            } else {
                selectedTapToken = { id, room, label: el.textContent.trim() };
                el.classList.add('selected-tap');
            }
        }

        function handleBoxTap(targetRoom) {
            if (selectedTapToken) {
                assignMatch(selectedTapToken.id, selectedTapToken.room, targetRoom);
                selectedTapToken = null;
                document.querySelectorAll('.draggable-item').forEach(d => d.classList.remove('selected-tap'));
            }
        }

        function assignMatch(id, itemRoom, targetRoom) {
            matchingState[targetRoom] = { id, itemRoom };
            const slot = document.getElementById(`target-slot-${targetRoom}`);
            const dragEl = document.getElementById(`drag-${id}`);
            
            if (slot && dragEl) {
                slot.textContent = dragEl.textContent.trim();
                slot.className = "w-full py-1.5 px-1 bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-lg text-center font-display font-bold text-xs";
                dragEl.style.opacity = "0.3";
            }
        }

        function checkMatchingResults() {
            const currentQ = QUESTIONS[currentStep];
            let allCorrect = true;
            let count = 0;

            currentQ.items.forEach(item => {
                if (matchingState[item.room] && matchingState[item.room].itemRoom === item.room) {
                    count++;
                } else {
                    allCorrect = false;
                }
            });

            if (count === currentQ.items.length) {
                playSound('correct');
                score += 20;
                showFeedback(true, "Correct! ⭐ All matched!");
                setTimeout(() => {
                    hideFeedback();
                    currentStep++;
                    renderStep();
                }, 1500);
            } else {
                playSound('incorrect');
                showFeedback(false, `You got ${count}/5 correct. Try again!`);
                setTimeout(() => {
                    hideFeedback();
                }, 1800);
            }
        }

        // Single Drag Handlers (Activity 6)
        let singleDragWord = "";

        function handleSingleDragStart(ev, word) {
            singleDragWord = word;
            ev.dataTransfer.setData("text/plain", word);
        }

        function handleSingleDragLeave(ev) {
            ev.currentTarget.classList.remove('drop-zone-active');
        }

        function handleSingleDrop(ev, correctWord) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drop-zone-active');
            const word = ev.dataTransfer.getData("text/plain") || singleDragWord;
            verifySingleDrag(word, correctWord);
        }

        function handleSingleTokenTap(word, el) {
            document.querySelectorAll('.draggable-item').forEach(d => d.classList.remove('selected-tap'));
            if (singleDragWord === word) {
                singleDragWord = "";
            } else {
                singleDragWord = word;
                el.classList.add('selected-tap');
            }
        }

        function handleSingleBoxTap(correctWord) {
            if (singleDragWord) {
                verifySingleDrag(singleDragWord, correctWord);
                singleDragWord = "";
            }
        }

        function verifySingleDrag(word, correctWord) {
            const slotText = document.getElementById('single-slot-text');
            if (slotText) slotText.textContent = word;

            if (word === correctWord) {
                playSound('correct');
                score += 10;
                showFeedback(true, "Great job! 🎉");
                setTimeout(() => {
                    hideFeedback();
                    currentStep++;
                    renderStep();
                }, 1400);
            } else {
                playSound('incorrect');
                showFeedback(false, "Almost! Try again.");
                setTimeout(() => {
                    hideFeedback();
                    if (slotText) slotText.textContent = "Drop correct Franco word here";
                }, 1400);
            }
        }

        function showFeedback(isSuccess, message) {
            feedbackText.textContent = message;
            feedbackIcon.textContent = isSuccess ? "✅" : "❌";
            
            feedbackBanner.className = `absolute bottom-4 left-4 right-4 p-4 rounded-2xl border text-center font-bold shadow-lg transition-all transform translate-y-0 opacity-100 z-50 flex items-center justify-center space-x-3 ${
                isSuccess 
                ? 'bg-emerald-500 text-white border-emerald-600' 
                : 'bg-rose-500 text-white border-rose-600'
            }`;
        }

        function hideFeedback() {
            feedbackBanner.classList.add('translate-y-2', 'opacity-0', 'hidden');
        }

        function renderFinalQuizResults() {
            progressBar.style.width = '100%';
            questionNumberEl.textContent = "Completed!";
            activityTitleEl.textContent = "Final Results & Homework Submission";

            const maxScore = 130; // Total possible score
            const isHigh = score >= 80;

            appCard.innerHTML = `
                <div class="flex flex-col items-center text-center space-y-6 my-auto">
                    <div class="w-20 h-20 rounded-full ${isHigh ? 'bg-emerald-100 text-emerald-500' : 'bg-amber-100 text-amber-500'} flex items-center justify-center text-4xl shadow-inner">
                        <i class="fa-solid ${isHigh ? 'fa-trophy' : 'fa-star-half-stroke'}"></i>
                    </div>

                    <div>
                        <h2 class="text-3xl font-extrabold font-display text-slate-800 mb-1">
                            ${isHigh ? 'Great work! 🎉' : 'Good try! 💪'}
                        </h2>
                        <p class="text-slate-500 font-medium text-base">
                            ${isHigh ? 'You mastered the rooms of the house in Franco Arabic!' : 'Let’s practice these words again to get 100%!'}
                        </p>
                    </div>

                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 w-full max-w-sm flex justify-around items-center shadow-sm">
                        <div>
                            <span class="text-xs text-slate-400 font-bold block uppercase">Your Score</span>
                            <span class="text-2xl font-black font-display text-emerald-600">${score}</span>
                        </div>
                        <div class="h-8 w-px bg-slate-200"></div>
                        <div>
                            <span class="text-xs text-slate-400 font-bold block uppercase">Total Questions</span>
                            <span class="text-2xl font-black font-display text-slate-700">${QUESTIONS.length}</span>
                        </div>
                    </div>

                    <!-- Formspree Homework Submission Form -->
                    <form action="https://formspree.io/f/mdenjpyn" method="POST" class="w-full max-w-sm space-y-4 pt-2">
                        <!-- Hidden Form Fields -->
                        <input type="hidden" name="Score" value="${score}">
                        <input type="hidden" name="Total Questions" value="${QUESTIONS.length}">
                        <input type="hidden" name="Completion Status" value="Completed">

                        <div class="text-left">
                            <label for="student-name" class="block text-xs font-bold text-slate-600 uppercase mb-1">Your Name</label>
                            <input type="text" id="student-name" name="Student Name" required placeholder="Enter your full name" 
                                   class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-emerald-500 focus:outline-none font-medium text-slate-800 placeholder-slate-400">
                        </div>

                        <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-display font-bold text-lg rounded-xl shadow-lg transition-all transform active:scale-98 flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span>Submit Homework</span>
                        </button>
                    </form>

                    <button onclick="initApp()" class="text-slate-400 hover:text-slate-600 font-bold text-sm underline pt-2">
                        Try Again 🔄
                    </button>
                </div>
            `;
        }

        // Initialize on load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
